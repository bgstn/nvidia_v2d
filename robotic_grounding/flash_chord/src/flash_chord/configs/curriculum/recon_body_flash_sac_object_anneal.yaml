_target_: flash_chord.configuration.make_fixed_curriculum

# recon_body_flash_sac plus four 25M-step stages that anneal weight from body joint tracking to
# object position tracking, for fine-tuning a finished 350M-step run (resume from its
# state_349999104 with training.total_environment_steps=449998848). The body joint weight keeps a
# floor of 1.0 so the humanoid still tracks its posture.
thresholds: [35000320, 70000640, 104998912, 139999232, 174999552, 209999872, 288749568, 306249728, 349999104, 374999040, 399998976, 424998912, 449998848]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 1.0
    objective_weights: &recon_body_weights
      termination: -300.0
      action_rate_l2: -0.0001
      action_l2: -0.000001
      soft_joint_limit: -0.001
      pelvis_position: 1.0
      pelvis_orientation: 1.0
      body_joint_position: 5.0
      object_position: 1.0
      progress: 1.0
      palm_position: 1.0
      palm_orientation: 1.0
      force_closure: 5.0
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.75
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.5
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.25
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.1
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.05
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
    immediate_first_frame_probability: 0.25
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
    immediate_first_frame_probability: 0.50
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights:
      <<: *recon_body_weights
      body_joint_position: 5.0
      object_position: 1.0
    immediate_first_frame_probability: 0.50
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights:
      <<: *recon_body_weights
      body_joint_position: 3.5
      object_position: 3.0
    immediate_first_frame_probability: 0.50
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights:
      <<: *recon_body_weights
      body_joint_position: 2.0
      object_position: 5.0
    immediate_first_frame_probability: 0.50
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights:
      <<: *recon_body_weights
      body_joint_position: 1.0
      object_position: 8.0
    immediate_first_frame_probability: 0.50
